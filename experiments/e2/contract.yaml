# E2 fixture contract (valid, tenant city-ops). Its single workload id is wl-0-city-monitoring,
# which the load driver passes to the L2/L3 gate's /admit. Kept minimal — E2 measures the control
# path's throughput overhead, not a specific tenant shape.
apiVersion: missionqos.dev/v0
kind: MissionQoSContract
metadata:
  tenant: city-ops
  mission: e2-load
spec:
  workloads:
    - missionClass: city-monitoring
      priority: 50
      slo:
        deadline: 5s
      throughputFloorRps: 100
      resourceClass: gpu-24g
      assuranceRatio: 0.95
      fallback: degrade
