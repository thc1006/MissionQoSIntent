# Stage-9 E2E fixture contract. Identical to the renderers' golden fixture (tenant ops-admin,
# mission urban-edge-2026), so `mqi compile test/e2e/contract.yaml` reproduces the byte-for-byte
# golden L2/L4/L5 bundle the harness then bridges onto a real kind cluster.
apiVersion: missionqos.dev/v0
kind: MissionQoSContract
metadata:
  tenant: ops-admin
  mission: urban-edge-2026
spec:
  workloads:
    - missionClass: emergency-routing
      priority: 100
      slo:
        deadline: 500ms
      throughputFloorRps: 50
      resourceClass: gpu-40g
      assuranceRatio: 0.999
      fallback: reject-with-reason
    - missionClass: city-monitoring
      priority: 50
      slo:
        deadline: 5s
      throughputFloorRps: 100
      resourceClass: gpu-24g
      assuranceRatio: 0.95
      fallback: degrade
    - missionClass: historical-analysis
      priority: 10
      slo:
        deadline: 60s
      resourceClass: gpu-24g
      assuranceRatio: 0.5
      fallback: shed
